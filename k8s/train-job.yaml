apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: mlops
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: ghcr.io/yasns/u1-train:sha-7983c97 # pinned
          env:
            - name: GIT_COMMIT # = image tag, lets reproduce.py check out this code
              value: 7983c97
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlops.svc.cluster.local:5000
            - name: HOME
              value: /tmp
          command: ["sh", "-c"]
          args:
            - |
              set -e
              python src/fetch_data.py
              python src/prepare.py
              python src/train.py
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
