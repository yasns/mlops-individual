apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: mlops
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: ghcr.io/yasns/mlops-individual:sha-0c456de # bumped by CD
          envFrom:
            - configMapRef:
                name: train-params          # hyper-parameters
            - secretRef:
                name: mlflow-credentials    # currently MLFLOW_TRACKING_URI since basic-auth is not enabled
          env:
            - name: HOME
              value: /tmp
          command: ["sh", "-c"]
          args:
            - |
              set -e
              python src/fetch_data.py
              python src/prepare.py
              python src/train.py --C "$TRAIN_C" --max_iter "$TRAIN_MAX_ITER"
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
